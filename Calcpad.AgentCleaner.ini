; Calcpad agent-cleaner pack: custom FluentCleaner rules for
; "agent junk" that LLM sessions tend to leave in and around repos.
; Install: drop this file into FluentCleaner's Custom folder next to
; FluentCleaner.exe/Classic.exe, then disable built-in entries you
; do not want to conflict with.
;
; Targets are intentionally narrow. They only touch files whose name
; or parent path clearly signals "generated by an agent/session."
; Do **not** extend these to broad recursive temp directories, because
; other tools publish legitimate output there.
;
; Scope:
;  - Calcpad repo-local agent artifacts (scratch pads, plan files,
;    chat exports, /clear recovery artifacts) under `.claude/`,
;    `.freebuff/`, `.superpowers/`, `.coder/` and similar.
;  - Very common LLMs-in-dev artifacts shared across repos (session
;    transcripts under .agents/, ARCHITECTURE.md session drafts, etc.)
;    when they exist next to a .gitignore or a known project marker.
;  - IDE/workspace state that is just a cache of the conversation:
;    open tabs, remembered selections, last-token/last-port files.
;  - Console and IDE output piles that have no lasting value:
;    transcript.log, full-test.log, console.html, problem-matcher dumps.

[Calcpad Agent Scratch Pads]
DetectFile=1
Detect1=Calcpad scratch pads: session transcripts and brainstorm boards beside the repo
Warning=Deep-research exports, brainstorm boards, and draft session files under CalcpadCE are usually disposable hallucination/scratch output. Enable this if you want to reclaim disk space after a session; disable it if an archive contains work you still need to review.
FileKey1=D:\croos\CalcpadCE|*.md.txt;*.md;*.txt;*.zip;*.json

[Calcpad Claude Session State]
DetectFile=1
Detect1=Claude session state: last-token/last-port files and brainstorm state
FileKey1=D:\croos\CalcpadCE\.claude\agent-state\lm-studio\last-token.txt
FileKey2=D:\croos\CalcpadCE\.claude\agent-state\lm-studio\last-port.txt
FileKey3=D:\croos\CalcpadCE\.claude\last-output.md
FileKey4=D:\croos\CalcpadCE\.claude\last-thinking.md
FileKey5=D:\croos\CalcpadCE\.claude\last-prompt.md
FileKey6=D:\croos\CalcpadCE\.claude\DONE.md
FileKey7=D:\croos\CalcpadCE\.claude\ErrorOutcome.json
FileKey8=D:\croos\CalcpadCE\.claude\Error.md
FileKey9=D:\croos\CalcpadCE\.claude\Todo.md
FileKey10=D:\croos\CalcpadCE\.claude\skills\last-output.md
FileKey11=D:\croos\CalcpadCE\.claude\skills\last-thinking.md
FileKey12=D:\croos\CalcpadCE\.claude\skills\last-prompt.md
FileKey13=D:\croos\CalcpadCE\.claude\skills\skills/last-output.md
FileKey14=D:\croos\CalcpadCE\.claude\skills\skills/last-thinking.md
FileKey15=D:\croos\CalcpadCE\.claude\skills\skills/last-prompt.md
 ; brainstorming state lives under a dated session folder; the state tree,
 ; last-port, and last-token files are ephemeral prompt-board state.
FileKey16=D:\croos\CalcpadCE\.superpowers\brainstorm\*/state/*
FileKey17=D:\croos\CalcpadCE\.superpowers\brainstorm\*/.last-port
FileKey18=D:\croos\CalcpadCE\.superpowers\brainstorm\*/.last-token

[Calcpad Web/Frontend Agent Artifacts]
DetectFile=1
Detect1=Calcpad web/frontend agent artifacts: full-test log, console dumps, and recordings
FileKey1=D:\croos\CalcpadCE\full-test.log
FileKey2=D:\croos\CalcpadCE\console.html
FileKey3=D:\croos\CalcpadCE\output\recordings\*.webm
FileKey4=D:\croos\CalcpadCE\screenshots\*.png
FileKey5=D:\croos\CalcpadCE\debug\console.html
FileKey6=D:\croos\CalcpadCE\problemMatcherResults.json
 ; Temp piles that tend to accumulate during web builds/tests are matched by
 ; process-local folder, never by broad recursive wildcard.
FileKey7=%LocalAppData%\Temp\calcpad-desktop\*
FileKey8=%Temp%\calcpad-desktop\*

[Calcpad IDE/Coding-Agent Workspace State]
DetectFile=1
Detect1=Calcpad IDE/authoring workspace caches: vscode history, copilot state, and claude commands cache
FileKey1=D:\croos\CalcpadCE\.vscode\.history\*
FileKey2=D:\croos\CalcpadCE\.vscode\.copilot\*
FileKey3=D:\croos\CalcpadCE\.claude\commandsCache\*
FileKey4=D:\croos\CalcpadCE\.claude\cache\*

[Calcpad Agent Transcripts and Session Dumps]
DetectFile1=1
Detect2=.gitignore contains session/agent markers
Detect3=tmp, temp, agent, brainstorm, conversation, transcript
FileKey1=%USERPROFILE%\.agents\*
FileKey2=%LOCALAPPDATA%\*.coder\*
FileKey3=C:\_agents\*
FileKey4=C:\Users\*\AppData\Local\.agents\*
FileKey5=D:\croos\CalcpadCE\.agents\*
FileKey6=D:\croos\CalcpadCE\tmp\*
FileKey7=D:\croos\CalcpadCE\temp\*
FileKey8=D:\croos\CalcpadCE\agent\*
FileKey9=D:\croos\CalcpadCE\.coder\*
FileKey10=D:\croos\CalcpadCE\.brainstorm\*
FileKey11=D:\croos\CalcpadCE\.conversation\*
FileKey12=D:\croos\CalcpadCE\transcript\*
FileKey13=D:\croos\CalcpadCE\.transcript\*
FileKey14=D:\croos\CalcpadCE\*.transcript.*
FileKey15=D:\croos\CalcpadCE\ARCHITECTURE.md.txt
FileKey16=D:\croos\CalcpadCE\architecture-review-*.html

[Calcpad Agent Caches - Exclude From Cleaning]
DetectFile=1
Detect1=Repositories sometimes keep lightweight helper notes next to agent config.
FileKey1=D:\croos\CalcpadCE\.claude\agents\cargo-offline-wind.md

[RegCalcpad Agent Cookies and Temp Registry]
DetectFile=1
Detect1=Calcpad agent-related registry leftovers are rare; only exact session-state keys are targeted.
RegKey1=HKCU\Software\Calcpad\agent-session-*
